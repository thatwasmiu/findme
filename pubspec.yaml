name: findme
description: "Find Me mobile: the paw-print trail, day diary, replay, share links and friends."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  clock: ^1.1.3
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  latlong2: ^0.10.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  build_runner: ^2.16.2
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
