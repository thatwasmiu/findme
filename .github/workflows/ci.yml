name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Check and build Android
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Ho_Chi_Minh # the tests assume Vietnam time, like the web tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build -d
          git diff --exit-code -- '*.g.dart' '*.freezed.dart'
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
      - name: Config (the FINDME_DEV_CONFIG secret if set, else the placeholder example)
        env:
          CFG: ${{ secrets.FINDME_DEV_CONFIG }}
        run: |
          if [ -n "$CFG" ]; then
            printf '%s' "$CFG" > config/dev.json
            echo "CONFIG=config/dev.json" >> "$GITHUB_ENV"
          else
            echo "CONFIG=config/example.json" >> "$GITHUB_ENV"
          fi
      - run: flutter build apk --flavor dev --debug --dart-define-from-file=$CONFIG --dart-define="APP_VERSION=$(git rev-parse --short HEAD) $(date -u '+%Y-%m-%d %H:%M')"
      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk

  ios:
    name: Build iOS (unsigned .ipa)
    # macOS minutes cost 10x on private repos: only on main, or when started by hand.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Config (the FINDME_DEV_CONFIG secret if set, else the placeholder example)
        env:
          CFG: ${{ secrets.FINDME_DEV_CONFIG }}
        run: |
          if [ -n "$CFG" ]; then
            printf '%s' "$CFG" > config/dev.json
            echo "CONFIG=config/dev.json" >> "$GITHUB_ENV"
          else
            echo "CONFIG=config/example.json" >> "$GITHUB_ENV"
          fi
      # Release: an iOS debug build does not start without a debugger attached.
      - run: flutter build ios --release --no-codesign --dart-define-from-file=$CONFIG --dart-define="APP_VERSION=$(git rev-parse --short HEAD) $(date -u '+%Y-%m-%d %H:%M')"
      - name: Pack the unsigned .ipa (sign and install it with Sideloadly, guide chapter 14 A2)
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry findme.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: findme-unsigned-ipa
          path: findme.ipa
