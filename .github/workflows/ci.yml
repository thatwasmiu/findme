name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    name: Check and build Android
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Ho_Chi_Minh # the tests assume Vietnam time, like the web tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build -d
          git diff --exit-code -- '*.g.dart' '*.freezed.dart'
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
      - run: flutter build apk --flavor dev --debug --dart-define-from-file=config/example.json --dart-define="APP_VERSION=$(git rev-parse --short HEAD) $(date -u '+%Y-%m-%d %H:%M')"
      - uses: actions/upload-artifact@v4
        with:
          name: app-dev-debug-apk
          path: build/app/outputs/flutter-apk/app-dev-debug.apk

  ios:
    name: Build iOS (no signing)
    # macOS minutes cost 10x on private repos: only on main, or when started by hand.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --no-codesign --dart-define-from-file=config/example.json --dart-define="APP_VERSION=$(git rev-parse --short HEAD) $(date -u '+%Y-%m-%d %H:%M')"
